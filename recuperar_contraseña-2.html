<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="asseds/css/agrofit.css">
    <link rel="stylesheet" href="asseds/fonts/fontawesome-free-6.1.2-web/css/all.min.css" />
    <link rel="stylesheet" href="asseds/fonts/poppins/poppins.css">
    <title>Agrofit</title>
</head>

<body>
    <div class="codigo_layout">

        <div class="codigo_text">
            <section class="codigo_content">
                <div class="codigo_title-contenedor">
                    <h1 class="codigo_title">Verificar Codigo</h1>
                </div>

                <div class="codigo-text_parrafo">
                    <p class="codigo_parrafo">Ingresa el codigo de 6 digitos que eviamos a tu correo</p>
                </div>

                <form action="recuperar_contraseña-3.html">
                <div class="codigo_grupo">
                    <input type="text" class="contraseña__input-2" name="code1" maxlength="1" required
                        placeholder=" " />
                    <input type="text" class="contraseña__input-2" name="code2" maxlength="1" required
                        placeholder=" " />
                    <input type="text" class="contraseña__input-2" name="code3" maxlength="1" required
                        placeholder=" " />
                    <input type="text" class="contraseña__input-2" name="code4" maxlength="1" required
                        placeholder=" " />
                    <input type="text" class="contraseña__input-2" name="code5" maxlength="1" required
                        placeholder=" " />
                    <input type="text" class="contraseña__input-2" name="code6" maxlength="1" required
                        placeholder=" " />
                </div>

                <div class="contraseña__mensaje">
                    <p class="contraseña_title-mensaje">¿No recibiste el codigo?</p>
                </div>

                <div class="contraseña__mensaje-parrafo">
                    <a class="contraseña_subtitle-mensaje" href=" ">Reenviar el codigo</a>
                </div>



                <button type="submit" class="codigo__button">Enviar</button>
                <div class="codigo_icon-button">
                    <i class="icon_button fa solid fa-arrow-right"></i>
                </div>
                </form>
            </section>
        </div>
</body>

</html>
