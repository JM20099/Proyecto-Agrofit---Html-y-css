<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="asseds/css/agrofit.css">
    <link rel="stylesheet" href="asseds/fonts/fontawesome-free-6.1.2-web/css/all.min.css" />
    <link rel="stylesheet" href="asseds/fonts/poppins/poppins.css">
    <title>Agrofit</title>
</head>

<body>
    <div class="recuperar_contraseña_layout-3">
        <div class="contraseña_text-3">
            <section class="contraseña_content-3">
                <div class="contraseña_title-contenedor-3">
                    <h1 class="contraseña_title-3">Nueva Contraseña</h1>
                </div>

                <div class="contraseña-text_parrafo-3">
                    <p class="contraseña_parrafo-3">Crea una contraseña segura para tu cuenta</p>
                </div>

                <form action="recuperar_contraseña-4.html">
                <div class="link__group-3">
                    <input type="password" class="link__input-3" name="name" required placeholder=" " />
                    <label for="name" class="form__label-3">Nueva Contraseña</label>
                    <div class="link_icon-icon-3">
                        <i class="link_icon-3  fa solid fa-key"></i>
                    </div>
                </div>

                <div class="link__group-3">
                    <input type="password" class="link__input-3" name="name" required placeholder=" " />
                    <label for="name" class="form__label-3">Confirma tu Contraseña</label>
                    <div class="link_icon-icon-3">
                        <i class="link_icon-3 fa solid fa-asterisk"></i>
                    </div>
                </div>

                <ul class="requisitos_list">
                    <li class="requisitos_item">
                        <i class="contraseña__icon-3 fa-regular fa-circle requisito_icon"></i>
                        <span class="contraseña_texto-3">Al menos 8 caracteres</span>
                    </li>
                    <li class="requisitos_item">
                        <i class="contraseña__icon-3 fa-regular fa-circle requisito_icon"></i>
                        <span class="contraseña_texto-3">Un número o símbolo especial</span>
                    </li>
                </ul>

                <button type="submit" class="codigo__button-3">Actualizar Contraseña</button>
                <div class="codigo_icon-button-3">
                    <i class="icon_button-3 fa solid fa-chevron-right"></i>
                </div>
                </form>
            </section>
        </div>
    </div>
</body>

</html>
