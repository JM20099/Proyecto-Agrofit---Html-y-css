<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="asseds/css/agrofit.css">
    <link rel="stylesheet" href="asseds/fonts/fontawesome-free-6.1.2-web/css/all.min.css"/>   
    <link rel="stylesheet" href="asseds/fonts/poppins/poppins.css">
    <title>Agrofit</title>
</head>
<body>
    <div class="recuperar_contraseña_layout">

        <div class="contraseña_text">
            <section class="contraseña_content">
                <div class="contraseña_title-contenedor">
                    <h1 class="contraseña_title">Recuperar Acceso</h1>
                </div>

                <div class="contraseña-text_parrafo">
                    <p class="contraseña_parrafo">Ingresa tu correo institucional para recibir las instrucciones de restablecimiento</p>
                </div>

                <form action="recuperar_contraseña-2.html">

                <div class="contraseña_botton">
                <input type="email" class="contraseña__input" name="name" required placeholder=" " required/>    <!-- crear campos interactivos dentro de un formulario-->     <!--required obliga al usuario a llenar el campo y placeholder muestra un texto dentro de la tabla vacia-->
                <label for="email" class="contraseña__label">Correo institucional</label>
                 <div class="contraseña_icon-icon">
                    <i class="contraseña_icon fa-solid fa-envelope "></i>
                </div>
                </div>

                
                <button type="submit" class="contraseña__button">Enviar Codigo</button>
                <div class="contraseña__button-button">
                    <i class="contraseña__button-icon fa solid fa fa-paper-plane"></i>
                </div>

                </form>
            </section>
        </div>



    </div>
</body>
</html>
